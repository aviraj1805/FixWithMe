    procedure: check_device
    sources: [anker_headphones]
  - id: jack_dirty
    component: audio_jack
    name: {en: Dirt in the jack or plug, hi: जैक या प्लग में गंदगी}
    short: {en: dirty jack, hi: गंदा जैक}
    prior: 0.15
    procedure: clean_jack
    sources: [anker_headphones]
  - id: cable_break
    component: audio_cable
